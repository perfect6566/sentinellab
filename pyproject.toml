[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "malware-ml-agent"
version = "0.1.0"
description = "Structured malware classification with a constrained tool-calling AI Agent"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "catboost>=1.2,<2",
  "flask>=3.1,<4",
  "joblib>=1.4,<2",
  "lightgbm>=4.5,<5",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "python-dotenv>=1.0,<2",
  "scikit-learn>=1.6,<2",
  "scipy>=1.13,<2",
  "torch>=2.6,<3",
  "xgboost>=2.1,<4",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
