services:
  - type: web
    name: sentinellab
    runtime: python
    branch: main
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements-runtime.txt
    startCommand: gunicorn --config gunicorn.conf.py wsgi:app
    autoDeployTrigger: off
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: REQUIRE_LIVE_LLM
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: LLM_PROVIDER
        value: deepseek
      - key: SECRET_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_API_BASE
        sync: false
      - key: LLM_API_KEY
        sync: false
